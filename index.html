<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEWL</title>
    <!-- link to stylesheets -->
    <link rel="stylesheet" href="./pages/index.css">
  </head>
  <body class="body">
    <div class="page">

      <header class="header">
        <img src="images/eewl_logo.svg" class="logo" alt="EEWL">
      </header>

      <main class="main">

        <section class="about">
        </section>

        <section class="gallery">
        </section>

        <section class="contact">
          <div class="contact__container">
            <h2 class="contact__title">Contact</h2>
            <form method="POST" class="contact__form" id="contact__form" name="edit-profile">
              <input class="contact__input contact__input_field_name" type="text" name="name" id="name" placeholder="Name" required>
              <input class="contact__input contact__input_field_email" type="email" name="email" id="email" placeholder="email@example.com" required>
              <input class="contact__input contact__input_field_subject" type="text" name="subject" id="subject" placeholder="Subject" required>
              <label for="msg-type">Message Type:</label>
              <select class="contact__input contact__input_field_msg-type" name="msg-type" id="msg-type" required>
                <option value="commission">Commission a custom piece</option>
                <option value="question">Ask a Question</option>
                <option value="other">Other</option>
              <select>
              <textarea class="contact__input contact__input_field_msg-body" name="msg-body" id="msg-body" required>Enter your message here.</textarea>
              <button class="contact__submit" type="submit" form="contact__form" value="Send">Send</button>
            </form>
          </div>
        </section>

      </main>

      <footer class="footer">
        <nav>
          <ul class="footer__links">
            <li class="footer__link"><a href="#" class="footer__link-content">Etsy</a></li>
            <li class="footer__link"><a href="#" class="footer__link-content">Instagram</a></li>
            <li class="footer__link"><a href="#" class="footer__link-content">Twitter</a></li>
            <li class="footer__link"><a href="#" class="footer__link-content">Facebook</a></li>
          </ul>
        </nav>
        <p class="footer__copyright">&copy; 2021. Elizabeth Wotawa</p>
      </footer>

      <div class="contact__gallery">
      </div>

    </div>

    <!-- link to javascript -->
    <script src="scripts/script.js"></script>

  </body>
</html>
