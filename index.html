<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEWL</title>
    <!-- link to stylesheets -->
    <link rel="stylesheet" href="./pages/index.css">
  </head>
  <body class="body">
    <div class="page">

      <header class="header">
        <img src="images/eewl_logo.svg" class="logo" alt="EEWL">
      </header>

      <main class="main">

        <section class="about">
        </section>

        <section class="gallery">
          <h2 class="gallery__title">Design Gallery</h2>
          <p class="gallery__text">Click on an image to learn more about the design.</p>
          <ul class="gallery__list">
            <li class="gallery__item">
              <img class="gallery__image" id = "gallery__image_item_sun-reeds" src="images/sun_and_reeds.jpg" onclick="openModal();currentSlide(1)" alt="image of designer wearing a scarf featuring a motif including the sun, Egyptian lotus flowers, and reeds. Colors are orange and black.">
            </li>
            <li class="gallery__item">
              <img class="gallery__image" id = "gallery__image_item_isis" src="images/isis.jpg" onclick="openModal();currentSlide(1)" alt="image of designer wearing a scarf featuring a motif of the Ancient Egyptian goddess Isis. Isis appears in a pose common on mummy coffins: kneeling, winged arms outstretched. Colors are orange and black.">
            </li>
            <li class="gallery__item">
              <img class="gallery__image" id = "gallery__image_item_skulls" src="images/skulls.jpg" onclick="openModal();currentSlide(1)" alt="image of designer wearing a scarf featuring skulls. Skulls alternate upright and upside-down along the length of the scarf. Colors are blue and a pink-yellow-orange variegated blend.">
            </li>
            <li class="gallery__item">
              <img class="gallery__image" id = "gallery__image_item_lotus" src="images/lotus.jpg" onclick="openModal();currentSlide(1)" alt="image of designer wearing a scarf featuring the Ancient Egyptian lotus flower. A lotus in full bloom is the finial on each end of the motif, alongside flower buds. Colors are orange and blue.">
            </li>
          </ul>
        </section>

        <section class="gallery__modal" id="gallery__modal">
          <div class="gallery__modal-close" onclick="closeModal()">&times;</div>
          <div class="gallery__modal-content" id="gallery__modal-content"></div>
        </section>

        <section class="contact">
          <div class="contact__container">
            <h2 class="contact__title">Contact</h2>
            <form method="POST" class="contact__form" id="contact__form" name="edit-profile">
              <input class="contact__input contact__input_field_name" type="text" name="name" id="name" placeholder="Name" required>
              <input class="contact__input contact__input_field_email" type="email" name="email" id="email" placeholder="email@example.com" required>
              <input class="contact__input contact__input_field_subject" type="text" name="subject" id="subject" placeholder="Subject" required>
              <label for="msg-type">Message Type:</label>
              <select class="contact__input contact__input_field_msg-type" name="msg-type" id="msg-type" required>
                <option value="commission">Commission a custom piece</option>
                <option value="question">Ask a Question</option>
                <option value="other">Other</option>
              <select>
              <textarea class="contact__input contact__input_field_msg-body" name="msg-body" id="msg-body" required>Enter your message here.</textarea>
              <button class="contact__submit" type="submit" form="contact__form" value="Send">Send</button>
            </form>
          </div>
        </section>

      </main>

      <footer class="footer">
        <nav>
          <ul class="footer__links">
            <li class="footer__link"><a href="#" class="footer__link-content">Etsy</a></li>
            <li class="footer__link"><a href="#" class="footer__link-content">Instagram</a></li>
            <li class="footer__link"><a href="#" class="footer__link-content">Twitter</a></li>
            <li class="footer__link"><a href="#" class="footer__link-content">Facebook</a></li>
          </ul>
        </nav>
        <p class="footer__copyright">&copy; 2021. Elizabeth Wotawa</p>
      </footer>

      <div class="contact__gallery">
      </div>

    </div>

    <!-- link to javascript -->
    <script src="scripts/script.js"></script>

  </body>
</html>
